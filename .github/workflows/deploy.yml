name: Build & Deploy

# The cv is a static site (no build). Just rsync the files to the server as
# `jcage` into the jcage-owned serve dir. No building on the box, no sudo.
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to my.nurvus.ai (rsync as jcage)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          rsync -az --delete \
            --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/var/www/my.nurvus.ai/"
          echo "Deployed cv to my.nurvus.ai"
